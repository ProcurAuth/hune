# Compose project of the expansion vectors and the parity capture (16.13, 15.14a).
# It runs a pinned Grafana with the ClickHouse plugin 4.5.1, a ClickHouse with synthetic data, and the service
# `import-tests`. That service makes the expansion vectors again from Grafana and fails when a vector differs from
# the committed file (tools/parity/vectors.mjs --check).
#
# Use: tests/ci/import.sh (it exports IMAGE_<NAME> from tests/images.lock and runs this file).
# The project publishes no port: the services reach each other on the network of the project only.
# The images come from tests/images.lock only. The plugin archive has its SHA-256 there; `plugin-fetch` checks it.

services:
  plugin-fetch:
    build:
      context: ../..
      dockerfile: tools/parity/Dockerfile
      args:
        NODE_IMAGE: ${IMAGE_NODE:?run tests/ci/import.sh}
    # Root writes the plugin volume. Grafana reads it, read-only.
    user: "0:0"
    environment:
      PLUGIN_REF: ${IMAGE_GRAFANA_CLICKHOUSE_PLUGIN:?run tests/ci/import.sh}
    volumes:
      - plugins:/plugins
      - ./grafana/fetch-plugin.mjs:/fetch-plugin.mjs:ro
    command: ["node", "/fetch-plugin.mjs", "/plugins"]
    restart: "no"

  clickhouse:
    image: ${IMAGE_CLICKHOUSE_LTS:?run tests/ci/import.sh}
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: grafana
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - ./grafana/clickhouse-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: "no"

  grafana:
    image: ${IMAGE_GRAFANA:?run tests/ci/import.sh}
    user: "472:0"
    depends_on:
      plugin-fetch:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: kubernetesDashboards,dashboardNewLayouts,dashboardScene
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - dashboards:/dashboards:ro
      - plugins:/var/lib/grafana/plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || curl -fs http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: "no"

  import-tests:
    build:
      context: ../..
      dockerfile: tools/parity/Dockerfile
      args:
        NODE_IMAGE: ${IMAGE_NODE:?run tests/ci/import.sh}
    user: "1000:1000"
    depends_on:
      grafana:
        condition: service_healthy
    working_dir: /src
    volumes:
      - ../..:/src:ro
      - dashboards:/dashboards
    # vectors.mjs writes its Chrome profile under target/ of the checkout: a memory file system gives it a place.
    tmpfs:
      - /src/target:uid=1000,gid=1000
    command:
      - node
      - tools/parity/vectors.mjs
      - --url
      - http://grafana:3000
      - --dashboards-dir
      - /dashboards
      - --check
    restart: "no"

volumes:
  plugins: {}
  dashboards: {}
