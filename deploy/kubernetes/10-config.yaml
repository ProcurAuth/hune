apiVersion: v1
kind: ConfigMap
metadata:
  name: hune-config-0-4-0
  namespace: hune
data:
  config.hcl: |
    server {
      listen                  = "0.0.0.0:8080"
      ops_listen              = "0.0.0.0:9090"
      base_path               = "/"
      editing                 = true
      max_connections         = 1024
      idle_timeout            = "75s"
      shutdown_grace          = "20s"
      max_request_bytes       = 4259840
      max_result_memory_bytes = 536870912
    }

    log {
      level = "info"
    }

    telemetry {
      enabled = false
    }

    storage {
      backend = "postgres"

      postgres {
        host              = "postgresql-rw.data.svc"
        port              = 5432
        database          = "hune"
        user              = "hune_app"
        password_file     = "/etc/hune/secrets/pg-app/password"
        sslmode           = "verify-full"
        max_connections   = 8
        connect_timeout   = "5s"
        statement_timeout = "10s"
        poll_interval     = "5s"
        history_keep      = 100

        tls {
          ca_file     = "/etc/hune/secrets/pg-ca/ca.crt"
          server_name = "postgresql-rw.data.svc"
        }
      }
    }

    access {
      mode = "authzen"

      identity {
        header           = "X-Identity-Token"
        issuer           = "https://portal.example.internal"
        audience         = "dashboards"
        public_keys_file = "/etc/hune/secrets/edge/jwks.json"
        max_age          = "5m"
        clock_skew       = "30s"
      }

      pdp {
        url             = "https://pdp.procurauth.svc:8443"
        token_file      = "/etc/hune/secrets/pdp/token"
        ca_file         = "/etc/hune/secrets/pdp/ca.crt"
        plain_http      = false
        timeout         = "500ms"
        cache_ttl       = "30s"
        max_connections = 4
      }
    }

    clickhouse "prod" {
      label                      = "Production"
      url                        = "https://clickhouse.example.internal:8443"
      user                       = "hune"
      password_file              = "/etc/hune/secrets/clickhouse/password"
      database                   = "analytics"
      connect_timeout            = "5s"
      max_execution_time         = "60s"
      max_result_rows            = 100000
      max_result_bytes           = 33554432
      max_query_size             = 1048576
      max_concurrent             = 16
      queue_wait                 = "10s"
      max_concurrent_per_subject = 6

      tls {
        ca_file     = "/etc/hune/secrets/clickhouse/ca.crt"
        server_name = "clickhouse.example.internal"
      }
    }

    # A PostgreSQL data source (13.12a, section 8a). The block is a comment. To use it, remove the first "#"
    # of each line, from the line `postgres "metrics" {` to its closing brace. Use the role of 8a.13, and nothing else:
    # - It is a dedicated login role, and it is not the role of the store.
    # - It has SELECT grants only, on the schemas that the dashboards read. It cannot write or create.
    # - Point "host" at a read replica when the data permits it.
    # The user name and the password come from files of a secret mount. A secret in clear text in this
    # file stops the start. The label of this block must differ from the label of each clickhouse block.
    #
    # postgres "metrics" {
    #   label                      = "Metrics"
    #   host                       = "hune-pg-ro.example.internal"
    #   port                       = 5432
    #   database                   = "analytics"
    #   user_file                  = "/etc/hune/secrets/pg-metrics/username"
    #   password_file              = "/etc/hune/secrets/pg-metrics/password"
    #   search_path                = "metrics"
    #   sslmode                    = "verify-full"
    #   connect_timeout            = "5s"
    #   max_execution_time         = "1m"
    #   max_result_rows            = 100000
    #   max_result_bytes           = 33554432
    #   max_query_size             = 1048576
    #   max_concurrent             = 16
    #   queue_wait                 = "5s"
    #   max_concurrent_per_subject = 6
    #
    #   tls {
    #     ca_file     = "/etc/hune/secrets/pg-metrics-ca/ca.crt"
    #     server_name = "hune-pg-ro.example.internal"
    #   }
    # }
  migrate.hcl: |
    server {
      listen                  = "0.0.0.0:8080"
