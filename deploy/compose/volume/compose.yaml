# Hune with a mounted folder of dashboards: one instance, mode open.
# The image comes from a local build of the release archive. It is never pulled or pushed.
name: hune-volume
services:
  hune:
    image: hune:0.1.3
    pull_policy: never
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["serve", "-c", "/etc/hune/config.hcl"]
    volumes:
      - ./config.hcl:/etc/hune/config.hcl:ro
      - ./dashboards:/var/lib/hune/dashboards
    secrets:
      - source: clickhouse_password
        target: clickhouse_password
      - source: clickhouse_ca
        target: clickhouse_ca.pem
      # PostgreSQL data source (13.12a): remove the "#" of the lines below and of the block in config.hcl.
      # The role is the read-only role of 8a.13. The files hold the user name, the password and the CA.
      # - source: postgres_metrics_username
      #   target: postgres_metrics_username
      # - source: postgres_metrics_password
      #   target: postgres_metrics_password
      # - source: postgres_metrics_ca
      #   target: postgres_metrics_ca.pem
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/hune", "health", "-c", "/etc/hune/config.hcl"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped
secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password
  clickhouse_ca:
    file: ./secrets/clickhouse_ca.pem
  # postgres_metrics_username:
  #   file: ./secrets/postgres_metrics_username
  # postgres_metrics_password:
  #   file: ./secrets/postgres_metrics_password
  # postgres_metrics_ca:
  #   file: ./secrets/postgres_metrics_ca.pem
