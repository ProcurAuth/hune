<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" role="img" aria-label="Architecture of Hune: a browser and an edge in front of one static binary that holds the HTTP server, the access guard, the catalog and query engine, the store and the three source clients, with a PDP on the side">
  <title>Architecture of the single binary</title>
  <desc>The browser reaches the edge. The edge signs an identity token and sends the request to Hune. Inside Hune, the HTTP server calls the access guard. The guard asks the PDP. The catalog and query engine read the store and call the source clients. The store is a folder or PostgreSQL. The source clients reach ClickHouse, PostgreSQL and MongoDB.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="1100" height="680" rx="20" fill="#12142a"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="40" y="52" font-size="24" font-weight="700" fill="#ffffff">One binary: page, access guard, query engine and clients</text>
    <text x="40" y="82" font-size="15" fill="#9ca3d4">Hune is one static program. It serves the page from memory and builds each query on the server.</text>

    <rect x="36" y="250" width="120" height="80" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="96" y="283" font-size="16" font-weight="700" fill="#e0e7ff" text-anchor="middle">Browser</text>
    <text x="96" y="304" font-size="12" fill="#c7d2fe" text-anchor="middle">the page comes</text>
    <text x="96" y="320" font-size="12" fill="#c7d2fe" text-anchor="middle">from Hune</text>
    <rect x="196" y="250" width="130" height="80" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="261" y="283" font-size="16" font-weight="700" fill="#e0e7ff" text-anchor="middle">Edge or proxy</text>
    <text x="261" y="304" font-size="12" fill="#c7d2fe" text-anchor="middle">signs the identity</text>
    <text x="261" y="320" font-size="12" fill="#c7d2fe" text-anchor="middle">token (authzen)</text>
    <path d="M156 290H194" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M326 290H378" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>

    <rect x="380" y="100" width="450" height="510" rx="16" fill="#171a38" stroke="#818cf8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="400" y="128" font-size="14" font-weight="700" fill="#a5b4fc">hune: one static binary (Linux, musl)</text>

    <rect x="400" y="148" width="410" height="56" rx="10" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="418" y="172" font-size="15" font-weight="700" fill="#e0e7ff">HTTP server</text>
    <text x="418" y="192" font-size="12.5" fill="#c7d2fe">hyper on tokio, the routes, the embedded page, the write guard</text>
    <rect x="400" y="224" width="410" height="56" rx="10" fill="#4338ca" fill-opacity="0.45" stroke="#818cf8" stroke-width="2"/>
    <text x="418" y="248" font-size="15" font-weight="700" fill="#ffffff">Access guard (PEP)</text>
    <text x="418" y="268" font-size="12.5" fill="#e0e7ff">checks the token, asks one question for each operation</text>
    <rect x="400" y="300" width="410" height="56" rx="10" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5"/>
    <text x="418" y="324" font-size="15" font-weight="700" fill="#e0e7ff">Catalog and query engine</text>
    <text x="418" y="344" font-size="12.5" fill="#c7d2fe">documents in memory, expander, checks, limits, permits</text>
    <g stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path d="M605 204V222"/>
      <path d="M605 280V298"/>
    </g>

    <path d="M605 356V376M450 376H715" stroke="#a5b4fc" stroke-width="2" fill="none"/>
    <g stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path d="M450 376V392"/>
      <path d="M715 376V392"/>
    </g>
    <rect x="400" y="394" width="200" height="56" rx="10" fill="#34d399" fill-opacity="0.22" stroke="#34d399" stroke-width="2"/>
    <text x="500" y="418" font-size="15" font-weight="700" fill="#d1fae5" text-anchor="middle">Store</text>
    <text x="500" y="437" font-size="12" fill="#a7f3d0" text-anchor="middle">volume or PostgreSQL</text>
    <rect x="620" y="394" width="190" height="56" rx="10" fill="#0ea5e9" fill-opacity="0.28" stroke="#38bdf8" stroke-width="2"/>
    <text x="715" y="418" font-size="15" font-weight="700" fill="#e0f2fe" text-anchor="middle">Source clients</text>
    <text x="715" y="437" font-size="12" fill="#bae6fd" text-anchor="middle">pools, limits, cancel</text>

    <path d="M450 450V532" stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M715 450V490M552 490H762" stroke="#a5b4fc" stroke-width="2" fill="none"/>
    <g stroke="#a5b4fc" stroke-width="2" fill="none" marker-end="url(#ar)">
      <path d="M552 490V532"/>
      <path d="M657 490V532"/>
      <path d="M762 490V532"/>
    </g>
    <g stroke="#2c3070" stroke-width="1.5" fill="#1c1f3d">
      <rect x="400" y="534" width="100" height="60" rx="10"/>
      <rect x="505" y="534" width="95" height="60" rx="10"/>
      <rect x="610" y="534" width="95" height="60" rx="10"/>
      <rect x="715" y="534" width="95" height="60" rx="10"/>
    </g>
    <g font-size="12.5" font-weight="700" fill="#e0e7ff" text-anchor="middle">
      <text x="450" y="560">Folder or</text><text x="450" y="577">PostgreSQL</text>
      <text x="552" y="568">ClickHouse</text>
      <text x="657" y="560">PostgreSQL</text><text x="657" y="577" font-size="11" font-weight="400" fill="#c7d2fe">read-only</text>
      <text x="762" y="568">MongoDB</text>
    </g>

    <rect x="906" y="206" width="158" height="92" rx="12" fill="#1c1f3d" stroke="#2c3070" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="985" y="238" font-size="16" font-weight="700" fill="#e0e7ff" text-anchor="middle">PDP</text>
    <text x="985" y="259" font-size="12" fill="#c7d2fe" text-anchor="middle">policy decision point</text>
    <text x="985" y="276" font-size="12" fill="#c7d2fe" text-anchor="middle">AuthZEN, ProcurAuth</text>
    <path d="M810 252H904" stroke="#a5b4fc" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="857" y="242" font-size="11.5" fill="#9ca3d4" text-anchor="middle">question</text>
    <text x="857" y="272" font-size="11.5" fill="#9ca3d4" text-anchor="middle">decision</text>

    <rect x="906" y="330" width="158" height="110" rx="12" fill="none" stroke="#2c3070" stroke-width="1.5"/>
    <text x="922" y="354" font-size="13" font-weight="700" fill="#a5b4fc">Mode open</text>
    <text x="922" y="374" font-size="12" fill="#c7d2fe">No edge and no PDP.</text>
    <text x="922" y="392" font-size="12" fill="#c7d2fe">Put a reverse proxy</text>
    <text x="922" y="410" font-size="12" fill="#c7d2fe">that signs users in</text>
    <text x="922" y="428" font-size="12" fill="#c7d2fe">in front of Hune.</text>

    <rect x="36" y="400" width="300" height="112" rx="12" fill="none" stroke="#2c3070" stroke-width="1.5"/>
    <text x="52" y="426" font-size="13" font-weight="700" fill="#34d399">Two ports</text>
    <text x="52" y="448" font-size="12" fill="#c7d2fe">server.listen: the page and the API.</text>
    <text x="52" y="466" font-size="12" fill="#c7d2fe">server.ops_listen: /livez, /readyz and</text>
    <text x="52" y="484" font-size="12" fill="#c7d2fe">/metrics. No token. Keep it private.</text>
    <text x="52" y="502" font-size="12" fill="#c7d2fe">A viewer never sends SQL.</text>
  </g>
</svg>
