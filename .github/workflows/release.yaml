# Release of Hune (17.3). A person starts it by hand on main, with the inputs `version` and `arm64`.
# It builds and attaches two tarballs and SHA256SUMS to a GitHub release that this workflow creates.
# With `arm64` false (a repository with no arm64 runner), it builds, sums and attaches the amd64 tarball only.
# It never pushes an image and never logs in to a registry (16.18). The image is built by the operator.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0"
        required: true
        type: string
      arm64:
        description: "Build the arm64 archive too (false: amd64 only, for a repository with no arm64 runner)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    # Step 1: check the input.
    runs-on: ubuntu-24.04
    env:
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version
        run: |
          set -eu
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run this workflow on main"; exit 1; }
          printf '%s\n' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $V"; exit 1; }
          cargo_v=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          [ "$cargo_v" = "$V" ] || { echo "Cargo.toml has version $cargo_v, not $V"; exit 1; }
          grep -qE "^## $V - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md || { echo "CHANGELOG.md has no heading '## $V - <date>'"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then echo "tag v$V exists"; exit 1; fi
          if grep -n 'digest: TO-PIN' tests/images.lock; then echo "tests/images.lock has an image with no digest"; exit 1; fi

  # Step 2: the jobs of the CI on this commit. All must pass.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yaml
    with:
      full: true
      arm64: ${{ inputs.arm64 }}
    secrets:
      HUNE_POLICY_WORDS: ${{ secrets.HUNE_POLICY_WORDS }}

  conformance:
    needs: check
    uses: ./.github/workflows/conformance.yml

  # Steps 3 to 5: build each target two times, check it, make its archive. One runner for each architecture.
  # The input arm64 false removes arm64 from the matrix.
  build:
    needs: [ci, conformance]
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(inputs.arm64 && '["amd64", "arm64"]' || '["amd64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: tests/ci/release-build.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: dist/hune_${{ inputs.version }}_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # Steps 5 to 9: SHA256SUMS, the draft release, the check of the draft, the publish.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      V: ${{ inputs.version }}
      ARM64: ${{ inputs.arm64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: List the archives
        # ARCHIVES: the tarballs of the release. ASSETS: the number of files of the draft (the tarballs and SHA256SUMS).
        run: |
          set -eu
          if [ "$ARM64" = true ]; then
            echo "ARCHIVES=hune_${V}_linux_amd64.tar.gz hune_${V}_linux_arm64.tar.gz" >> "$GITHUB_ENV"
            echo "ASSETS=3" >> "$GITHUB_ENV"
          else
            echo "ARCHIVES=hune_${V}_linux_amd64.tar.gz" >> "$GITHUB_ENV"
            echo "ASSETS=2" >> "$GITHUB_ENV"
          fi
      - name: Make SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          # ARCHIVES holds one or two names: the split on blanks is intended.
          sha256sum $ARCHIVES > SHA256SUMS
          cat SHA256SUMS
      - name: Make the release notes
        run: tools/changelog-section.sh "$V" > notes.md
      - name: Make the draft release
        working-directory: dist
        run: |
          set -eu
          gh release create "v$V" --draft --target "$GITHUB_SHA" --title "Hune v$V" --notes-file ../notes.md \
            $ARCHIVES SHA256SUMS
      - name: Check the draft
        run: |
          set -eu
          n=$(gh release view "v$V" --json assets --jq '.assets | length')
          [ "$n" = "$ASSETS" ] || { echo "the draft has $n files, not $ASSETS"; exit 1; }
          mkdir check
          gh release download "v$V" --dir check
          (cd check && sha256sum -c SHA256SUMS)
      - name: Publish the draft
        id: publish
        # After this call starts, the workflow never deletes the draft or the release (17.3, step 9).
        run: gh release edit "v$V" --draft=false --latest
      - name: Delete the draft after a failure before the publish call
        # Step 9: only when the job failed before the publish step started. The publish step is then skipped.
        if: failure() && steps.publish.conclusion == 'skipped'
        run: gh release delete "v$V" --yes || true
