# Jobs `procurauth` (16.12, 11.32) and `failover` (16.11) of 16.17.
# The job `procurauth` runs `tests/conformance/run.sh`: the conformance series U of ProcurAuth against Hune.
# The job `failover` is a stub: the script tests/failover/run.sh does not exist yet. Until it exists, the job
# prints a message and passes. When the script exists, the job runs `tests/failover/run.sh kill` and
# `tests/failover/run.sh partition`.
# Runs: a pull request that changes the paths below, the nightly workflow, and the release workflow.
# No job pushes an image or logs in to a registry (16.18).
# Each step pins its action to a full commit SHA and gives the version in a comment. Dependabot proposes the updates.
# Each checkout keeps no credentials in the work tree (persist-credentials: false).
name: conformance

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  procurauth:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide if the job runs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # A pull request runs the job only when it changes these paths (16.17). Other events run it.
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE...HEAD" |
            grep -qE '^(crates/hune/src/access/|crates/hune/src/config/|crates/hclconf/|tests/conformance/|Cargo\.(toml|lock)$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the conformance series U
        if: steps.paths.outputs.run == 'true'
        run: tests/conformance/run.sh

  failover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide if the job runs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(crates/hune-store/|tests/failover/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the failover test, mode kill and mode partition
        if: steps.paths.outputs.run == 'true'
        run: |
          # Stub: the job passes while the script does not exist.
          if [ -x tests/failover/run.sh ]; then
            tests/failover/run.sh kill
            tests/failover/run.sh partition
          else
            echo "failover: tests/failover/run.sh does not exist yet; stub"
          fi
