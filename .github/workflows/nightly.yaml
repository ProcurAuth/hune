# Nightly jobs of 16.17: `nightly`, `procurauth` and `failover`. No job pushes an image or logs in to a registry (16.18).
# The job `nightly` runs 1,000 random seeds and the jobs `source`, `pgsource` and `mongosource` again.
# It runs no fuzz target here: only `tests/ci/nightly.sh --local` runs them (see the script).
# Each step pins its action to a full commit SHA and gives the version in a comment. Dependabot proposes the updates.
# Each checkout keeps no credentials in the work tree (persist-credentials: false).
# The job `conformance` calls conformance.yml: each job of that workflow has its own timeout.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/ci/nightly.sh

  conformance:
    uses: ./.github/workflows/conformance.yml
