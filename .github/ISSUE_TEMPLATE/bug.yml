name: Defect
description: Hune does not do what the documents say.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `hune version`.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Data source
      options:
        - ClickHouse
        - PostgreSQL
        - MongoDB
        - Not related to a data source
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Store
      options:
        - Volume (a folder)
        - PostgreSQL
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access mode
      options:
        - open
        - authzen
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The blocks that matter. Remove each secret and each real host name.
      render: hcl
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat the problem
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What you expected, and what happened
      description: Add the lines of the log, with the secrets removed. Remove the query text if it is private.
    validations:
      required: true
